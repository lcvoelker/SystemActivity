version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/db/migrations/00001_init.sql
      - internal/db/migrations/00002_activity_retention.sql
      - internal/db/migrations/00003_session_end_reason.sql
      - internal/db/migrations/00004_session_kinds.sql
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - column: session_summary.last_activity_at
            go_type:
              type: time.Time
              pointer: true
