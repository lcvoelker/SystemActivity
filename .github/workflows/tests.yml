# Runs every test on a GitHub-hosted Windows machine with throwaway
# Postgres clusters, so nothing runs on a developer's PC or touches a real
# database. Start it by hand from the Actions tab ("Run workflow"), or let it
# run on pushes and pull requests.
name: tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go and end-to-end tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set paths
        run: |
          "PG_DIR=$env:RUNNER_TEMP\pg-go" >> $env:GITHUB_ENV
          "COVER_DIR=$env:RUNNER_TEMP\e2e-cover" >> $env:GITHUB_ENV
          "FILEMASTER_BIN=$env:RUNNER_TEMP\filemaster.exe" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Vet
        run: go vet ./...

      - name: Start throwaway Postgres for Go tests
        run: python tests/pgtemp.py start --dir "$env:PG_DIR" --port 54329 --github-env

      - name: Migrate test database
        run: |
          $env:MIGRATE_DATABASE_URL = $env:FILEMASTER_TEST_MIGRATE_DATABASE_URL
          go run ./cmd/filemaster migrate up

      - name: Go unit and integration tests
        run: go test -count=1 -coverpkg=./... "-coverprofile=go-coverage.out" ./...

      - name: Build filemaster with coverage
        run: go build -cover -coverpkg=./... -o "$env:FILEMASTER_BIN" ./cmd/filemaster

      - name: End-to-end tests
        run: |
          $env:GOCOVERDIR = $env:COVER_DIR
          python -m pytest tests -v "--junitxml=e2e-results.xml"

      - name: Coverage report
        if: always()
        run: |
          $summary = @("## Coverage", "")
          if (Test-Path go-coverage.out) {
            $go = (go tool cover "-func=go-coverage.out" | Select-Object -Last 1) -replace '\s+', ' '
            $summary += "- Go unit and integration tests: $go"
          }
          if (Test-Path "$env:COVER_DIR") {
            go tool covdata textfmt "-i=$env:COVER_DIR" "-o=e2e-coverage.out"
            $e2e = (go tool cover "-func=e2e-coverage.out" | Select-Object -Last 1) -replace '\s+', ' '
            $summary += "- End-to-end tests (real filemaster binary): $e2e"
          }
          $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $summary

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            go-coverage.out
            e2e-coverage.out
            e2e-results.xml
          if-no-files-found: ignore

      - name: Stop Postgres
        if: always()
        run: python tests/pgtemp.py stop --dir "$env:PG_DIR"
